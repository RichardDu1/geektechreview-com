<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#accent)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.03" stroke="#ef4444" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Brand color glow circle -->
  <circle cx="600" cy="280" r="140" fill="#ef4444" opacity="0.08" filter="url(#glow)"/>

  <!-- Category icon -->
  <g transform="translate(540, 180) scale(5)">
    <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258A4 4 0 0 0 17.32 5z" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="450" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#ef4444" opacity="0.7" letter-spacing="3">
    LG
  </text>

  <!-- Product title -->
  <text x="600" y="500" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="700" fill="#e8e8ed">
    LG G4 OLED TV
  </text>

  <!-- Category badge -->
  <g transform="translate(600, 560)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ef4444">
      GAMING
    </text>
  </g>

  <!-- GeekTechReview logo text -->
  <text x="600" y="680" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="500" fill="#8b8b94" letter-spacing="2">
    GEEKTECHREVIEW
  </text>

  <!-- Accent bar at bottom -->
  <rect x="500" y="700" width="200" height="3" rx="1.5" fill="#ef4444" opacity="0.5"/>
</svg>